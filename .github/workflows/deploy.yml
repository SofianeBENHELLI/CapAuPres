name: Tests et déploiement Cloudflare Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Déploiement (main = production, autres branches = préversion)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 29c23e9ef1f1f235ffec98705e4069e7
          command: pages deploy app --project-name capaupres --branch ${{ github.ref_name }} --commit-hash ${{ github.sha }}
